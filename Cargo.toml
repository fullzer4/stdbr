[workspace]
resolver = "2"
members = ["core", "bindings/ffi-c", "bindings/nodejs", "bindings/python", "bindings/wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
strip = true
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = "thin"
