name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  publish-crates:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p stdbr-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish stdbr (retry until crates.io index updates)
        shell: bash
        run: |
          for i in $(seq 1 10); do
            cargo publish -p stdbr --token ${{ secrets.CARGO_REGISTRY_TOKEN }} && exit 0
            sleep 15
          done
          exit 1

  build-nodejs:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Zig
        if: matrix.target == 'aarch64-unknown-linux-gnu' || contains(matrix.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - run: npm ci
        working-directory: bindings/nodejs
      - run: npx napi build --platform --release --target ${{ matrix.target }}
        working-directory: bindings/nodejs
      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: bindings/nodejs/*.node
          if-no-files-found: error

  publish-nodejs:
    needs: build-nodejs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
        working-directory: bindings/nodejs
      - uses: actions/download-artifact@v4
        with:
          path: bindings/nodejs/artifacts
          pattern: napi-*
          merge-multiple: true
      - name: Move artifacts into npm packages
        working-directory: bindings/nodejs
        shell: bash
        run: |
          for f in artifacts/*.node; do
            [ -e "$f" ] || continue
            target=$(basename "$f" | sed 's/^stdbr\.//' | sed 's/\.node$//')
            case "$target" in
              linux-x64-gnu)    dest=npm/linux-x64-gnu/stdbr.linux-x64-gnu.node ;;
              linux-x64-musl)   dest=npm/linux-x64-musl/stdbr.linux-x64-musl.node ;;
              linux-arm64-gnu)  dest=npm/linux-arm64-gnu/stdbr.linux-arm64-gnu.node ;;
              darwin-x64)       dest=npm/darwin-x64/stdbr.darwin-x64.node ;;
              darwin-arm64)     dest=npm/darwin-arm64/stdbr.darwin-arm64.node ;;
              win32-x64-msvc)   dest=npm/win32-x64-msvc/stdbr.win32-x64-msvc.node ;;
              *) echo "Unknown target: $target"; exit 1 ;;
            esac
            cp "$f" "$dest"
          done
      - name: Publish main package (publishes platform packages via napi prepublish)
        working-directory: bindings/nodejs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-wasm:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build --release --target web
        working-directory: bindings/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --access public
        working-directory: bindings/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ${{ matrix.os }}
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --non-interactive --skip-existing
          working-directory: bindings/python

  build-ffi:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall cbindgen -y
      - run: cargo build --release -p stdbr-ffi --target ${{ matrix.target }}
      - run: cbindgen --crate stdbr-ffi --output stdbr.h
      - shell: bash
        run: |
          mkdir -p "stdbr-ffi-${{ matrix.target }}"
          cp stdbr.h "stdbr-ffi-${{ matrix.target }}/"
          cp "target/${{ matrix.target }}/release/libstdbr.a" "stdbr-ffi-${{ matrix.target }}/" 2>/dev/null || true
          cp "target/${{ matrix.target }}/release/libstdbr.so" "stdbr-ffi-${{ matrix.target }}/" 2>/dev/null || true
          cp "target/${{ matrix.target }}/release/stdbr.dll" "stdbr-ffi-${{ matrix.target }}/" 2>/dev/null || true
          tar czf "stdbr-ffi-${{ matrix.target }}.tar.gz" "stdbr-ffi-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: stdbr-ffi-*.tar.gz
          if-no-files-found: error

  publish-ffi:
    needs:
      - release-please
      - build-ffi
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ffi-artifacts
          pattern: ffi-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ffi-artifacts/*.tar.gz
