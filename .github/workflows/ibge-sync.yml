name: IBGE Sync Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ibge-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: IBGE sync test
        run: nix develop --command bazel test //tests/parity:parity_rust

      - name: Open issue if out of sync
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `IBGE municipality data out of sync (${new Date().toISOString().split('T')[0]})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ibge-sync',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  '## IBGE municipality data is out of sync',
                  '',
                  'The daily sync check detected differences between `core/src/municipio.rs` and the live IBGE API.',
                  '',
                  `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join('\n'),
                labels: ['ibge-sync'],
              });
            }
