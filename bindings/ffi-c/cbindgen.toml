language = "C"
cpp_compat = true
include_guard = "STDBR_H"
autogen_warning = "/* Generated by cbindgen — do not edit. */"
documentation = true
documentation_style = "doxy"
documentation_length = "short"
tab_width = 4
style = "both"

header = """
/**
 * @file stdbr.h
 * @brief stdbr — standard library for Brazil.
 *
 * All strings returned by stdbr functions are heap-allocated
 * and must be freed with stdbr_free().
 */"""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
