[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "stdbr"
version = "0.3.3"
description = "Standard library for Brazil"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "stdbr contributors" }]
requires-python = ">=3.9"
keywords = ["brazil", "cep", "cnpj", "cpf", "validation"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/fullzer4/stdbr"
Repository = "https://github.com/fullzer4/stdbr"
Issues = "https://github.com/fullzer4/stdbr/issues"

[tool.maturin]
module-name = "stdbr.stdbr"
python-source = "python"
